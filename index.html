<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixAmForMe</title>
    <link rel="icon" type="image/png" href="FixAmForMe_no_words_transparent.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px;
        }

        .main {
            width: min(1000px, 90vw);
            display: flex;
            flex-direction: column;
            align-items: flex-start;

            flex: 1;

            justify-content: center;
        }

        .top,
        .bottom {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .bottom {
            margin-top: auto;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin-bottom: 0px;
        }

        p {
            font-size: 25px;
            color: #FFFFFF;
            max-width: 400px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1;
        }

        .social {
            display: flex;
            gap: 20px;
            margin-top: auto;
        }

        .social a {
            color: #00FF26;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .social a:hover svg {
            stroke: #FFFFFF;
        }

        .social a:hover .x-logo {
            fill: #FFFFFF;
            stroke: none;
        }

        .hero-tagline {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;

            font-size: clamp(2.5rem, 6.5vw, 10rem);
            font-weight: 600;
            gap: 0rem;

            line-height: 0.85;
            margin-bottom: 30px;
        }

        #start,
        #end {
            text-transform: uppercase;
        }

        #name {
            color: #00FF26;
            text-transform: uppercase;
        }


        /*.name-carousel {
            perspective: 800px;
            width: 140px;
            display: inline-block;
            text-align: center;
        }

        #name {
            display: inline-block;
            color: #00FF26;
            width: 100%;
            white-space: nowrap;
        }
        */

        .name-carousel {
            perspective: 800px;
            display: inline-block;
        }

        #name {
            display: inline-block;
            white-space: nowrap;
            color: #00FF26;

            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        #tagline {
            min-height: calc(25px * 4);
            /* 3 lines worth of text */
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            will-change: opacity, transform;
        }

        .flip {
            animation: flipX 0.7s ease;
        }

        @keyframes flipX {
            0% {
                transform: rotateX(0deg);
                opacity: 1;
            }

            50% {
                transform: rotateX(90deg);
                opacity: 0;
            }

            100% {
                transform: rotateX(0deg);
                opacity: 1;
            }
        }

        /*
        .hero-tagline {
            font-size: 30px;
        }
        */
    </style>
</head>

<body>
    <div class="top">
        <img src="FixAmForMe.png" alt="FixAmForMe Logo" class="logo" width="200" height="200">
    </div>
    <div class="main">


        <div class="hero-tagline">
            <div id="start"></div>

            <div class="name-carousel">
                <span id="name"></span>
            </div>

            <div id="end"></div>
        </div>


        <p id="tagline">Your mechanic. Your way. We're working hard to bring you the easiest way to find trusted
            mechanics in Ghana.
        </p>

    </div>
    <div class="bottom">
        <div class="social">
            <a href="https://instagram.com/fixamforme" target="_blank" aria-label="Follow us on Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="#00FF26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                    <circle cx="12" cy="12" r="4" />
                    <circle cx="17.5" cy="6.5" r="0.5" fill="#00FF26" />
                </svg>
            </a>
            <a href="https://x.com/fixamforme" target="_blank" aria-label="Follow us on X">
                <svg class="x-logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                    fill="#00FF26">
                    <path
                        d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622 5.912-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                </svg>
            </a>
        </div>
    </div>


    <script>
        const templates = [
            {
                start: "GOOD NEWS.",
                end: "IS ON THE WAY"
            },
            {
                start: "RELAX.",
                end: "HAS IT COVERED"
            },
            {
                start: "",
                end: "TO THE RESCUE"
            },
            {
                start: "",
                end: "KNOWS WHAT'S WRONG"
            },
            {
                start: "WHEN IT MATTERS, CALL",
                end: ""
            },
            {
                start: "",
                end: "IS ALREADY ON THE WAY"
            },
            {
                start: "",
                end: "WILL BE THERE SHORTLY"
            },
            {
                start: "NO STRESS.",
                end: "IS COMING"
            },
            {
                start: "",
                end: "GO FIX AM"
            }
        ];

        // pick ONE per session
        let template = sessionStorage.getItem("heroTemplate");

        if (!template) {
            template = JSON.stringify(
                templates[Math.floor(Math.random() * templates.length)]
            );
            sessionStorage.setItem("heroTemplate", template);
        }

        template = JSON.parse(template);

        document.getElementById("start").textContent = template.start;
        document.getElementById("end").textContent = template.end;

        const names = [
            /* Akan */
            "Kwame", "Kofi", "Kojo", "Kwadwo", "Kwabena", "Yaw", "Kwaku", "Akwasi",
            "Ama", "Akosua", "Abena", "Adwoa", "Yaa", "Afia", "Efua", "Akua", "Esi",
            "Nana", "Osei", "Boateng", "Abenaa", "Osafoaa", "Asantewaa", "Coby", 
            "Delasi", "Selasi", "Aferi", "Ewuku", "Kweku", "Dayshin", "Nana Yaw",
            "Jude", "Kobina", "Sinead", "Nana Ama",

            /* Ewe */
            "Dzifa", "Emefa", "Selorm", "Kafui", "Mawuli", "Edem", "Delali", "Amewuga",
            "Komla", "Fiavi", "Senanu", "Agbenyo", "Agbemafle", "Dela", "Amevi", 

            /* Ga-Adangbe */
            "Naa", "Akweley", "Korkor", "Adoley", "Shika", "Tetteh", "Lartey", "Quartey",
            "Lamptey", "Ashitey", "Ayele", "Laweh", "Naa Dede", "Dede", "Mensah",

            /* Northern Ghana */
            "Iddrisu", "Yakubu", "Seidu", "Sulemana", "Abdulai", "Ziblim", "Yahaya",
            "Issahaku", "Alhassan", "Murtala", "Hamza", "Zakaria", "Osman", "Ibrahim", "Adam",

            /* Gonja / Northern Belt */
            "Sumaila", "Fuseini", "Yussif", "Mahama", "Salifu", "Musah", "Alidu",
            "Sule", "Haruna", "Nurudeen",

            /* Upper West / Upper East */
            "Wuni", "Atampuba", "Balinia", "Kanton", "Billa", "Abubakar", "Issaka",
            "Tanko", "Zuwera",

            /* Widely used Ghanaian surnames (kept as first-name style tokens) */
            "Ofori", "Mensah", "Appiah", "Addo", "Owusu", "Asamoah", "Antwi", "Darko",
            "Boadi", "Nyarko", "Frimpong", "Asiedu", "Baffoe", "Agyemang", "Aboagye",

            "Emmanuel", "Elijah", "David", "Daniel", "Joseph", "John", "Samuel", "Michael", "Peter", "Paul",
            "Isaac", "Joshua", "Blessing"
        ];

        const text = `Your mechanic. Your way. We're working hard to bring you the easiest way to find trusted mechanics in Ghana.`;
        const el = document.getElementById("tagline");

        const nameEl = document.getElementById("name");

        let shuffledNames = [];
        let index = 0;

        const words = text.split(" ");
        el.innerHTML = "";

        let i = 0;

        function showWord() {
            if (i < words.length) {
                el.innerHTML += words[i] + " ";
                i++;
                setTimeout(showWord, 90); // speed control
            }
        }



        function shuffle(array) {
            return array
                .map(value => ({ value, sort: Math.random() }))
                .sort((a, b) => a.sort - b.sort)
                .map(({ value }) => value);
        }

        function initNames() {
            shuffledNames = shuffle([...names]);
            index = 0;

            // show first name immediately
            nameEl.textContent = shuffledNames[index];
            index++;
        }

        function rotateName() {
            nameEl.classList.add("flip");

            setTimeout(() => {
                if (index >= shuffledNames.length) {
                    initNames();
                }

                nameEl.textContent = shuffledNames[index];
                index++;
            }, 350);

            setTimeout(() => {
                nameEl.classList.remove("flip");
            }, 700);
        }

        // start
        initNames();

        // wait 1 frame so CSS initial state is applied
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                el.style.opacity = 1;
                el.style.transform = "translateY(0)";
            });

            showWord();
        });


        setInterval(rotateName, 2500);
    </script>
</body>

</html>
