<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixAmForMe</title>
    <link rel="icon" type="image/png" href="fixamforme.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .logo {
            width: 200px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #00FF26;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        p {
            font-size: 18px;
            color: #FFFFFF;
            opacity: 0.7;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .social {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .social a {
            color: #00FF26;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #00FF26;
            padding: 10px 24px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .social a:hover {
            background: #00FF26;
            color: #000000;
        }
    </style>
</head>

<body>
    <img src="fixamforme.png" alt="FixAmForMe Logo" class="logo">
    <h1>Coming Soon</h1>
    <p>Your mechanic. Your way. We're working hard to bring you the easiest way to find trusted mechanics in Ghana.</p>
    <div class="social">
        <a href="https://instagram.com/fixamforme" target="_blank">Instagram</a>
    </div>
</body>

</html>
